    - heading: "Business Websites"
      items:
        - title: "Naser Furniture (~3 months)"
          subtitle: "End-to-End Store for a Furniture Business"
          description: "Built end to end for a furniture store client: a server-rendered Hebrew catalog gallery on Cloudflare's edge, and an admin where the owner uploads and manages products. Performance was a core focus throughout: server-side rendering, image preloading with thumbnail placeholders, prefetching, lazy-loaded components, batched data loading and layout-shift fixes. Also includes experiments in AI image enhancement and 3D models generated from photos, and a proof of concept for hosting more stores."
          tech: "React 19 TypeScript, TanStack Start (SSR), Convex, Cloudflare Pages, Gemini / fal.ai (AI experiments)"
        - title: "DJ Bar Twito (~1 weeks)"
          url: "https://www.dj-bar-twito.co.il"
          description: "Landing page for DJ sound and lighting services specializing in weddings and events."
          tech: "React TypeScript (frontend), WIX Headless Services (backend)"
        - title: "Loft5 (~4 weeks)"
          url: "https://www.loft5.vip"
          description: "Professional event hall booking website for a luxury venue in Qazrin with integrated karaoke, photography services, and F&B management."
          tech: "React TypeScript (frontend), Convex (database & storage backend)"
        - title: "HaShovach (~3 weeks)"
          url: "https://www.hashovach.com"
          description: "Landing page and booking system for zimmer accommodation with integrated wellness center offering massage therapy and spa services."
          tech: "React TypeScript (frontend), Convex (database & storage backend)"

    - heading: "Single Page Applications (2024-Present)"
      items:
        - title: "EventQR"
          subtitle: "Wedding Photo Sharing by QR Code"
          url: "https://eventqr.link"
          description: "Guests scan the QR code on their table and post photos to a shared, Instagram-style gallery, with no app and no account; the couple later gets the photographers' album in the same place. Engineered for the wedding night's real constraint, one congested venue network shared by 200 guests: a 150 KB app-shell budget enforced in CI, photo compression in the browser before upload, tiny blurred placeholders (ThumbHash), batched upload signing, chunked video uploads with a retry queue that survives reloads, edge image resizing, and kill switches for the night."
          tech: "React 19 TypeScript, Convex, Cloudflare R2 + Image Transformations, Better Auth"
        - title: "ADELA Research App (ongoing)"
          subtitle: "Weizmann Institute"
          url: "https://adela-research.onrender.com"
          description: "Research platform for a kindergarten field study on how children ages 5-6 choose solutions to everyday social conflicts. An offline, audio-first tablet app for the children's sessions, and a researcher admin for sessions, content and answer coding."
          tech: "React TypeScript, Convex, offline PWA"
        - title: "Gushnik (~ 5 months)"
          subtitle: "Local Business Club Platform"
          url: "https://gushnik.com"
          description: "Networking platform connecting local business owners and professionals. Serves as a membership-based community hub facilitating connections and business development among local entrepreneurs."
          tech: "React TypeScript"

    - heading: "Long-Running Projects"
      items:
        - title: "Revoducate (~3 months, In Development)"
          subtitle: "Adaptive Learning-Path Platform"
          description: "Hebrew-first platform for adaptive, branching learning paths. An AI authoring agent grounded (RAG) on real curriculum documents builds paths of interactive stations; learners launch from any school LMS via LTI 1.3 and grades post back to the gradebook (AGS). Includes a visual Path Designer, a lesson/activity editor, a learner player, and Common Cartridge / SCORM import-export."
          tech: "React 19 TypeScript, TanStack Router, Convex (database, workflows, RAG), AI SDK, Tailwind/shadcn, LTI 1.3"
        - title: "Accompanier (In Progress)"
          subtitle: "Research Prototype – Tel-Hai College"
          description: "Prototype for a participatory research study: a browser assistant that helps people with cognitive disabilities fill in Israeli public-service web forms, explaining each field in simple Hebrew through a speaking avatar. It never submits a form for the user."
          tech: "React TypeScript, LLM integration, Chrome extension"
        - title: "Webbi (Proof of Concept)"
          subtitle: "Multi-Tenant Site Building Platform"
          description: "Proof of concept for a site building platform enabling businesses to create branded mini-site experiences through a template system. Features multi-tenant architecture with unique subdomains and cross-subdomain authentication."
          tech: "React TypeScript (frontend), Convex (database & backend services), Cloudflare Workers (deployment)"
        - title: "Kavim Ledmutam (~2 years)"
          subtitle: "Memorial Project Platform"
          url: "https://www.kavimledmutam.co.il"
          description: "Volunteer memorial project connecting painters with families of fallen IDF heroes. Features individual memorial pages, family story management, and comprehensive CRM with multi-team workflow supporting 7 operational crews."
          tech: "React (frontend), WIX No-Code Builder with custom HTTP endpoints (backend CMS)"
        - title: "MePo (~3 years, ongoing)"
          subtitle: "Educational Data Management Platform"
          url: "https://www.mepo.info"
          description: "Platform for safely managing and sharing student data between schools, extracurricular activities, transportation providers, and parents. Features unified communication center and secure data sharing protocols."
          tech: "React TypeScript (frontend), SQL Database, hosted on Google Cloud Platform"
        - title: "Teacher Companion App (~8 months, In Development)"
          subtitle: "Master's Thesis Project"
          description: "Digital companion streamlining the teaching workflow cycle (plan > execute > assess > reflect > re-plan). Reduces \"technological fatigue\" by unifying teaching tools into a single interface with AI-powered assistance."
          tech: "React TypeScript, AI SDK integration, widget architecture"

