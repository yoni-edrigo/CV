summary: >
  I started as VR R&D Lead at the Tel-Hai Innovation Lab, then moved into
  freelance web development, and went on to build my own EdTech product, MePo,
  which schools in Northern Israel use to share student data. My M.Ed. research
  focused on interface design for teacher-facing apps. Now I also lead the
  technology side of Revoducate, an AI-powered adaptive learning platform, as a
  freelance CTO, while I keep building apps and websites for clients and to learn.

projects:
