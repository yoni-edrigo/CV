summary: >
  התחלתי כראש תחום פיתוח ומחקר VR במעבדת החדשנות של תל-חי, משם עברתי לפיתוח
  ווב כעצמאי, ובניתי את מוצר ה-EdTech שלי, MePo, שבתי ספר בצפון הארץ משתמשים בו
  לשיתוף נתוני תלמידים. בתואר השני חקרתי עיצוב ממשקים לאפליקציות שמשמשות מורים.
  היום אני גם מוביל את הצד הטכנולוגי של Revoducate, פלטפורמת למידה אדפטיבית
  מבוססת AI, כ-CTO בפרילנס, ובמקביל ממשיך לבנות אפליקציות ואתרים ללקוחות וכדי
  ללמוד.

