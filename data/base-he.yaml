      items:
        - title: "EventQR"
          subtitle: "שיתוף תמונות בחתונה בסריקת QR"
          url: "https://eventqr.link"
          description: "האורחים סורקים את קוד ה-QR שעל השולחן ומעלים תמונות לגלריה משותפת בסגנון אינסטגרם, בלי אפליקציה ובלי הרשמה; הזוג מקבל בהמשך גם את אלבום הצלמים באותו מקום. מותאם לאתגר האמיתי של ערב החתונה – רשת אחת עמוסה שמשותפת ל-200 אורחים: תקציב של 150KB לטעינה הראשונית שנאכף בבדיקות, דחיסת תמונות בדפדפן לפני ההעלאה, תמונות ממוזערות מטושטשות זעירות, העלאת וידאו בחלקים עם תור ניסיונות חוזרים ששורד רענון, התאמת גודל תמונות בקצה הרשת, ו\"מתגי חירום\" לניהול הערב."
          tech: "React 19 TypeScript, Convex, Cloudflare R2"
        - title: "נאסר רהיטים (~3 חודשים)"
          subtitle: "חנות מקצה לקצה לעסק רהיטים"
          description: "פיתוח מקצה לקצה עבור לקוח – חנות רהיטים: גלריית קטלוג בעברית עם רינדור בצד השרת על תשתית הקצה של Cloudflare, וממשק ניהול שבו בעל העסק מעלה ומנהל מוצרים. דגש מרכזי על ביצועים: רינדור בצד השרת, טעינה מוקדמת של תמונות עם תמונות ממוזערות, טעינה מראש, טעינה עצלה של רכיבים ומניעת קפיצות בפריסה. כולל גם ניסויים בשיפור תמונות ב-AI ויצירת מודלים תלת-ממדיים מתמונות, והוכחת היתכנות לאירוח חנויות נוספות."
          tech: "React 19 TypeScript, TanStack Start (SSR), Convex, Cloudflare Pages"
        - title: "ADELA Research (פעיל)"
          subtitle: "מכון ויצמן"
          url: "https://adela-research.onrender.com"
          description: "פלטפורמת מחקר שדה בגני ילדים על האופן שבו ילדים בני 5-6 בוחרים פתרונות לקונפליקטים חברתיים: אפליקציית טאבלט קולית שעובדת גם ללא רשת, וממשק ניהול לחוקרים (מפגשים, תוכן וקידוד תשובות)."
          tech: "React TypeScript, Convex, PWA"
        - title: "גושניק (~שבועיים)"
          subtitle: "מועדון עסקים מקומי"
          url: "https://gushnik.com"
          description: "פלטפורמת רשת מקצועית לבעלי עסקים מקומיים."
          tech: "React TypeScript"

    - heading: "אתרי עסקים - התאמה ללקוחות (~2-3 שבועות כל אחד)"
      description: "פיתוח פתרונות הזמנות ודפי נחיתה מותאמים אישית לעסקי שירות מגוונים, המדגימים יכולת להתאים במהירות ארכיטקטורה טכנית לדרישות לקוח ייחודיות. בניית אפליקציות ממוקדות לקוח באמצעות React TypeScript עם אינטגרציית backend גמישה (Convex, WIX Headless Services), יצירת חוויות משתמש מלוטשות בתחומי שירותי אירועים, אירוח ובריאות."
