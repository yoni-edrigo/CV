      items:
        - title: "Revoducate (~3 חודשים, בפיתוח)"
          subtitle: "פלטפורמת מסלולי למידה מסתעפים"
          description: "פלטפורמה בעברית-תחילה לבניית מסלולי למידה אדפטיביים ומסתעפים. סוכן AI המעוגן (RAG) במסמכי תוכנית לימודים אמיתיים בונה מסלולים של תחנות אינטראקטיביות; לומדים נכנסים מכל מערכת LMS בית-ספרית באמצעות LTI 1.3, והציון חוזר לגיליון הציונים (AGS). כולל מעצב מסלולים ויזואלי, עורך שיעורים ופעילויות, נגן ללומד, וייבוא/ייצוא Common Cartridge ו-SCORM."
          tech: "React 19 TypeScript, TanStack Router, Convex, AI SDK, LTI 1.3"
        - title: "Accompanier (בפיתוח)"
          subtitle: "אב-טיפוס מחקרי – מכללת תל-חי"
          description: "אב-טיפוס למחקר משתף: עוזר בדפדפן שמסייע לאנשים עם מוגבלות קוגניטיבית למלא טפסים באתרי שירות ציבוריים, ומסביר כל שדה בעברית פשוטה באמצעות אווטאר מדבר. הוא אף פעם לא שולח טופס במקום המשתמש."
          tech: "React TypeScript, שילוב LLM, תוסף Chrome"
        - title: "קווים לדמותם (~4 חודשים)"
          subtitle: "פלטפורמת הנצחה"
          url: "https://www.kavimledmutam.co.il"
          description: "פרויקט התנדבותי הקושר ציירים עם משפחות גיבורי צה\"ל שנפלו. בניית ממשק React עם דפי הנצחה ומערכת CRM מקיפה המנהלת 7 צוותי עבודה תפעוליים באמצעות פלטפורמת WIX עם נקודות קצה HTTP מותאמות."
          tech: "React, WIX No-Code Builder"
        - title: "MePo (~שנתיים, פעיל)"
          subtitle: "פלטפורמת ניהול נתונים חינוכיים"
          url: "https://www.mepo.info"
          description: "פלטפורמה לניהול נתונים חינוכיים המקשרת בתי ספר, תוכניות חוץ-לימודיות, ספקי הסעות והורים. חלק ממחקר תזה מתמשך על חדשנות טכנולוגית חינוכית. גרסה 3 כעת בפיתוח עם תכונות משופרות."
          tech: "React TypeScript, SQL, Google Cloud Platform"

    - heading: "אפליקציות - פתרונות ממוקדים"
      items:
        - title: "נאסר רהיטים (~3 חודשים)"
          subtitle: "חנות מקצה לקצה לעסק רהיטים"
          description: "פיתוח מקצה לקצה עבור לקוח – חנות רהיטים: גלריית קטלוג בעברית עם רינדור בצד השרת על תשתית הקצה של Cloudflare, וממשק ניהול שבו בעל העסק מעלה ומנהל מוצרים. דגש מרכזי על ביצועים: רינדור בצד השרת, טעינה מוקדמת של תמונות עם תמונות ממוזערות, טעינה מראש, טעינה עצלה של רכיבים ומניעת קפיצות בפריסה. כולל גם ניסויים בשיפור תמונות ב-AI ויצירת מודלים תלת-ממדיים מתמונות, והוכחת היתכנות לאירוח חנויות נוספות."
          tech: "React 19 TypeScript, TanStack Start (SSR), Convex, Cloudflare Pages"
        - title: "ADELA Research (פעיל)"
          subtitle: "מכון ויצמן"
          url: "https://adela-research.onrender.com"
          description: "פלטפורמת מחקר שדה בגני ילדים על האופן שבו ילדים בני 5-6 בוחרים פתרונות לקונפליקטים חברתיים: אפליקציית טאבלט קולית שעובדת גם ללא רשת, וממשק ניהול לחוקרים (מפגשים, תוכן וקידוד תשובות)."
          tech: "React TypeScript, Convex, PWA"
        - title: "גושניק (~שבועיים)"
          subtitle: "מועדון עסקים מקומי"
          url: "https://gushnik.com"
          description: "פלטפורמת רשת מקצועית לבעלי עסקים מקומיים."
          tech: "React TypeScript"

    - heading: "אתרי עסקים - התאמה ללקוחות (~2-3 שבועות כל אחד)"
      description: "פיתוח פתרונות הזמנות ודפי נחיתה מותאמים אישית לעסקי שירות מגוונים, המדגימים יכולת להתאים במהירות ארכיטקטורה טכנית לדרישות לקוח ייחודיות. בניית אפליקציות ממוקדות לקוח באמצעות React TypeScript עם אינטגרציית backend גמישה (Convex, WIX Headless Services), יצירת חוויות משתמש מלוטשות בתחומי שירותי אירועים, אירוח ובריאות."
