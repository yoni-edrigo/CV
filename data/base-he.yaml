summary: >
  מפתח תוכנה ויזם טכנולוגי המתמחה בטכנולוגיה חינוכית משולבת AI. בונה
  מוצרים בהובלת סוכני קוד מבוססי AI (Claude Code) בתפקיד ראש צוות טכני ובעל
  מוצר: כתיבת האפיון, תכנון העבודה, קביעת הכללים ובדיקת כל שינוי בבדיקות
  אוטומטיות. ניסיון מוכח בפיתוח מוצרים חינוכיים דיגיטליים והובלת צוותים
  ליישום פתרונות חדשניים בסביבות מורכבות.

projects:
