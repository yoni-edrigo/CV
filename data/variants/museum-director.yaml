# Museum Director - organizational/pedagogical leadership (Hebrew)
base: base-he
label: "Museum Director"
order: 4

summary: >
  מנהל מערכות חינוך וטכנולוגיה עם תואר שני בניהול וארגון מערכות חינוך. בעל
  ניסיון עשיר בהובלה אסטרטגית של מיזמים חינוכיים, ניהול צוותים ומתנדבים,
  והטמעת תהליכי מדידה והערכה. מומחה בפיתוח והתאמת פתרונות פדגוגיים לצרכי
  השטח, תוך שילוב חדשנות טכנולוגית לשיפור תהליכי למידה והוראה. בעל יכולת
  מוכחת בניהול תקציב, בניית שותפויות עם רשויות מקומיות ומוסדות חינוך,
  והובלת שינויים מערכתיים.

