summary: >
  מחנך ומפתח טכנולוגיה חינוכית בעל תואר שני בניהול וארגון מערכות חינוך
  ותעודת הוראה, עם שילוב ייחודי של ניסיון פדגוגי בשטח, הובלת תהליכי שינוי
  בית-ספריים ופיתוח תכניות הכשרה למורים. בעל 3+ שנות ניסיון בהוראה ובליווי
  צוותים חינוכיים, כולל הנחיית סדנאות למורים, פיתוח מערכי למידה
  התנסותית-יוצרת, והטמעת שינויים פדגוגיים בבתי ספר. מחפש להצטרף לצוות
  פואנטה ולהוביל תהליכי שינוי פדגוגיים במערכת החינוך הירושלמית.

