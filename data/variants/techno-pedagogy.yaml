# Techno-Pedagogy - teaching and computational thinking (Hebrew)
base: base-he
label: "טכנו-פדגוגיה"
order: 5

summary: >
  מחנך ומפתח טכנולוגיה חינוכית בעל תואר שני בניהול וארגון מערכות חינוך, עם
  שילוב ייחודי של ניסיון פדגוגי בשטח ויכולות פיתוח תוכנה. בעל 3 שנות ניסיון
  בהוראה בבית הספר תוך שילוב תקשוב בתהליכי הוראה-למידה, כולל הוראת חשיבה
  חישובית והנחיית סדנאות AI למורים. חוקר בתחום כלים טכנו-פדגוגיים דיגיטליים,
  עם יכולת מוכחת בהובלת פרויקטים חדשניים, איסוף וניתוח נתונים, ועבודה מול
  רשויות מקומיות, בתי ספר וצוותי הוראה.

